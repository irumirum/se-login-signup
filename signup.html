<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICSI418Y | HW01</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>ICSI418Y - Homework 01</h1>
    </header>

    <div class="container">
        <h2>Sign Up</h2>

        <form action="/signup" method="post">
            <!-- Asks user info to set up an account -->
            <label for="first-name">First Name:</label>
            <input class="userInput" type="text" id="first-name" name="first-name" required><br><br>

            <label for="last-name">Last Name:</label>
            <input class="userInput" type="text" id="last-name" name="last-name" required><br><br>
        
            <label for="username">User ID:</label>
            <input class="userInput" type="text" id="username" name="username" required><br><br>

            <label for="password">Password:</label>
            <input class="userInput" type="password" id="password" name="password" required><br><br>

            <div id="buttonLink">
                <input type="submit" value="Submit" onclick="alert('Signed Up Successfully')">
                <a href="login.html">Log In Here</a>
            </div>
            
        </form>
    </div>
</body>
</html>
