<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICSI418Y | HW01</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>ICSI418Y - Homework 01</h1>
    </header>

    <div class="container">
        <h2>Login</h2>

        <form action="/login" method="post">
            <!-- Asks user for username -->
            <label for="username">User ID:</label>
            <input class="userInput" type="text" id="username" name="username" required><br><br>

            <!-- Asks user for password -->        
            <label for="password">Password:</label>
            <input class="userInput" type="password" id="password" name="password" required><br><br>
            
            <div id="buttonLink">
                <input type="submit" value="Login" onclick="alert('Logged In Successfully')">
                <a href="signup.html">Sign Up Here</a>
            </div>

        </form>
    </div>
</body>
</html>
